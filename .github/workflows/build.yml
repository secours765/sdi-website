name: Build und Inhaltsprüfung
on:
  push:
    branches: [main, "work/**", "codex/**"]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run check:links
      - name: Unterpfad prüfen
        run: npm run build && npm run check:links
        env:
          SDI_BASE: /sdi-website/
