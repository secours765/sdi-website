name: Build und Inhaltsprüfung
on:
  push:
    branches: [main, "work/**", "codex/**"]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.1'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Domainwurzel prüfen
        run: npm run build && npm run check:links
        env:
          SDI_SITE: https://sdi-domain.invalid
          SDI_BASE: /
      - name: GitHub-Unterpfad prüfen
        run: npm run build && npm run check:links
        env:
          SDI_SITE: https://secours765.github.io
          SDI_BASE: /sdi-website/
